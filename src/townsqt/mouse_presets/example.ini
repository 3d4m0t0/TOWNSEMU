# Copy to mouse_XXXXXXXX.ini (XXXXXXXX = lowercase disc fingerprint).
# Filename selects the CD; disc_fingerprint_hash must match when present.
#
# integration_mode:
#   0 = mouse capture
#   1 = Mouse BIOS
#   2 = app-specific, memory write
#   3 = app-specific, gameport
#   4 = Default
#
# Omit unused keys (Phys 2, Bind EXP, invert, …). Defaults apply.

[mouse_preset]
disc_fingerprint_hash=0x00000000
integration_mode=2
pair0_x=0x00000000
pair0_y=0x00000000
pair0_min_x=0
pair0_max_x=0
pair0_min_y=0
pair0_max_y=0
pair0_scale_x=1
pair0_scale_y=1
offset_x=0
offset_y=0
invert_x=0
invert_y=0
wait_feedback=1
stop_soft_write=0
# pair1_x=0x00000000
# pair1_y=0x00000000
# pair1_scale_x=1
# pair1_scale_y=1
# app_exec_name=GAME.EXP
# app_exec_hash=0x00000000
